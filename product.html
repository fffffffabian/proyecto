<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Flow — Detalle de producto</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts: Poppins (headings) + Open Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ff-primary: #A44A3F;   /* terracota */
      --ff-accent:  #E4B363;   /* ámbar */
      --ff-bg:      #FAF3EA;   /* crema */
      --ff-ink:     #3a2b26;
    }
    body {
      background: var(--ff-bg);
      color: var(--ff-ink);
      font-family: "Open Sans", system-ui, sans-serif;
    }
    h1, h2, h3, h4, h5, .navbar-brand, .card-title {
      font-family: "Poppins", system-ui, sans-serif;
    }
    .ff-navbar { background: var(--ff-primary); }
    .ff-navbar .navbar-brand { color: #fff; font-weight: 700; letter-spacing: .3px; }
    .ff-navbar .ff-back { color: #fff; text-decoration: none; font-weight: 600; }
    .ff-navbar .ff-back:hover { text-decoration: underline; }

    .ff-card {
      border: none;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(110, 70, 55, .10);
    }
    .ff-hero {
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      font-size: 6rem;
      background: linear-gradient(135deg, #f6e2c4, var(--ff-accent));
    }
    .ff-badge {
      background: rgba(164, 74, 63, .10);
      color: var(--ff-primary);
      font-weight: 600;
    }
    .ff-title { color: var(--ff-primary); font-weight: 700; }
    .ff-price { color: var(--ff-primary); font-weight: 700; font-size: 1.6rem; }
    .ff-btn {
      background: var(--ff-accent);
      color: var(--ff-ink);
      font-weight: 600;
      border: none;
    }
    .ff-btn:hover { background: #d8a24f; color: var(--ff-ink); }
    .ff-meta { color: #6b5750; }
    footer { color: #8a756c; }
  </style>
</head>
<body>

  <!-- Barra superior con navegación de regreso -->
  <nav class="navbar ff-navbar shadow-sm">
    <div class="container">
      <a class="ff-back" href="index.html">← Volver al menú</a>
      <span class="navbar-brand mb-0 h1">🍽️ Food Flow</span>
    </div>
  </nav>

  <main class="container py-4">
    <div id="detalle"></div>

    <!-- Estado de error -->
    <div id="estado" class="text-center py-5 d-none">
      <div style="font-size:3rem">🔎</div>
      <p id="estado-msg" class="lead mt-2 mb-3"></p>
      <a class="btn ff-btn" href="index.html">← Volver al menú</a>
    </div>
  </main>

  <footer class="text-center py-4">
    <small>Food Flow · pedidos a domicilio para PyMEs</small>
  </footer>

  <script>
    const ICONO_PROD = {
      "Rollos": "🍣", "Especialidades": "🍤"
    };

    function mostrarEstado(mensaje) {
      document.getElementById("detalle").innerHTML = "";
      document.getElementById("estado-msg").textContent = mensaje;
      document.getElementById("estado").classList.remove("d-none");
    }

    // ¿Qué producto se abrió? (viene del enlace del menú)
    const params = new URLSearchParams(window.location.search);
    const idProducto = Number(params.get("id"));

    Promise.all([
      fetch("data/products.json").then(function (r) { return r.json(); }),
      fetch("data/businesses.json").then(function (r) { return r.json(); })
    ])
    .then(function (datos) {
      const productos = datos[0];
      const tiendas = datos[1];

      const p = productos.find(function (x) { return x.id === idProducto; });
      if (!p) {
        mostrarEstado("No encontramos ese producto.");
        return;
      }

      const tienda = tiendas.find(function (t) { return t.id === p.business_id; });
      document.title = "Food Flow — " + p.name;

      const boton = p.available
        ? '<button class="btn ff-btn btn-lg">Agregar al carrito</button>'
        : '<button class="btn btn-secondary btn-lg" disabled>No disponible</button>';

      const notaTienda = tienda
        ? '<p class="ff-meta mb-3">De <strong>' + tienda.name + '</strong> · 📍 ' + tienda.delivery_zone + ' · 🛵 Envío: Q' + tienda.shipping_cost + '</p>'
        : '';

      document.getElementById("detalle").innerHTML =
        '<div class="row g-4 align-items-center">' +
          '<div class="col-12 col-md-5">' +
            '<div class="card ff-card"><div class="ff-hero">' + (ICONO_PROD[p.category] || "🍽️") + '</div></div>' +
          '</div>' +
          '<div class="col-12 col-md-7">' +
            '<span class="badge ff-badge mb-2">' + p.category + '</span>' +
            '<h1 class="ff-title mb-2">' + p.name + '</h1>' +
            '<p class="ff-meta mb-2">' + p.description + '</p>' +
            notaTienda +
            '<p class="ff-price mb-4">Q' + p.price + '</p>' +
            boton +
          '</div>' +
        '</div>';
    })
    .catch(function () {
      mostrarEstado("No encontramos ese producto.");
    });
  </script>

  <!-- Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
